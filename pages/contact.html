<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIFY | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="hero short">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div class="photo"></div><div class="grain"></div>
    <nav>
      <div class="logo">AMIFY</div>
      <ul>
        <li><a class="link" href="/index.html">Home</a></li>
        <li><a class="link" href="/pages/about.html">About</a></li>
        <li><a class="link" href="/pages/features.html">Features</a></li>
        <li><a class="link active" href="/pages/contact.html">Contact</a></li>
      </ul>
      <a class="btn" href="/index.html#join">Join waitlist</a>
    </nav>
  
    <div class="page-title">
      <h1>Talk to us.</h1>
      <p class="lead">Questions, ideas or partnerships. Send a message and we will reply by email.</p>
    </div>
  </header>
  
  <svg class="wave" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 90V40C240 0 480 0 720 30s480 40 720 0v60Z"/></svg>

  <section class="body-section">
    <form id="cform" class="light-form" novalidate>
      <input class="field" type="text" name="name" placeholder="Your name" autocomplete="name" required>
      <input class="field" type="email" name="email" placeholder="Email address" autocomplete="email" required>
      <textarea class="field" name="message" placeholder="Your message" required></textarea>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" type="submit" id="cbtn">Send message</button>
      <p class="msg" id="cmsg" role="status" aria-live="polite"></p>
    </form>
    
    <p style="margin-top:26px">Or email us directly: <a href="mailto:iadesanya539@gmail.com">iadesanya539@gmail.com</a></p>
  </section>
  <script>
    const f = document.getElementById('cform'), m = document.getElementById('cmsg'), b = document.getElementById('cbtn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault(); m.className = 'msg'; m.textContent = '';
      const d = Object.fromEntries(new FormData(f));
      if (!d.name.trim() || !d.message.trim()) { m.className = 'msg err'; m.textContent = 'Fill in your name and message.'; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) { m.className = 'msg err'; m.textContent = 'Enter a valid email address.'; return; }
      b.disabled = true; b.textContent = 'Sending...';
      try {
        const r = await fetch('https://formsubmit.co/ajax/iadesanya539@gmail.com', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ ...d, _subject: 'AMIFY contact message from ' + d.name, _template: 'table', _captcha: 'false' })
        });
        const o = await r.json().catch(() => ({}));
        if (!r.ok || o.success === 'false') throw new Error(o.message || 'Could not send. Try again.');
        f.reset(); m.className = 'msg ok'; m.textContent = 'Message sent. We will reply soon.';
      } catch (err) { m.className = 'msg err'; m.textContent = err.message; }
      b.disabled = false; b.textContent = 'Send message';
    });
  </script>

  <footer>AMIFY &copy; 2026. <a href="mailto:iadesanya539@gmail.com">iadesanya539@gmail.com</a></footer>
</body>
</html>
